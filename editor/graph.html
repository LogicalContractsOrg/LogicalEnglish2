<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/telemetry.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical English Graph View</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --text-color: #d4d4d4;
            --header-bg: #333;
            --menu-bg: #2d2d2d;
            --border-color: #444;
            --input-bg: #3c3c3c;
            --input-text: #ccc;
            --input-border: #555;
            --label-color: #aaa;
            --sidebar-width: 220px;
        }

        .light-theme {
            --bg-color: #ffffff;
            --text-color: #000000;
            --header-bg: #f3f3f3;
            --menu-bg: #eeeeee;
            --border-color: #cccccc;
            --input-bg: #ffffff;
            --input-text: #333;
            --input-border: #cccccc;
            --label-color: #555;
        }

        .hc-theme {
            --bg-color: #000000;
            --text-color: #ffffff;
            --header-bg: #000000;
            --menu-bg: #000000;
            --border-color: #ffffff;
            --input-bg: #000000;
            --input-text: #ffffff;
            --input-border: #ffffff;
            --label-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #header {
            height: 40px;
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            box-sizing: border-box;
            overflow: hidden;
        }

        #title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
        }

        #controls {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-grow: 1;
            justify-content: flex-end;
            min-width: 0;
        }

        #controls button {
            width: auto;
            white-space: nowrap;
            padding: 4px 8px;
            font-size: 11px;
            flex-shrink: 0;
        }

        #controls input {
            width: 120px;
            padding: 4px 8px;
            font-size: 11px;
            flex-shrink: 1;
            min-width: 50px;
        }

        #main-container {
            display: flex;
            height: calc(100% - 41px);
            width: 100%;
        }

        #sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background-color: var(--menu-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 20px;
            overflow-y: auto;
        }

        #graph-container {
            flex-grow: 1;
            background-color: var(--bg-color);
            position: relative;
        }

        /* A message over the graph area when there is nothing to draw (the
           program is not loaded, the server lost it, the graph failed). */
        #graph-status {
            display: none;
            position: absolute;
            inset: 0;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            color: var(--label-color);
            font-size: 14px;
            pointer-events: none;
            z-index: 5;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 11px;
            color: var(--label-color);
            font-weight: bold;
            text-transform: uppercase;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        select, button, input:not([type="checkbox"]) {
            background-color: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--input-border);
            padding: 6px 10px;
            font-size: 12px;
            outline: none;
            border-radius: 3px;
            width: 100%;
        }

        input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        button {
            cursor: pointer;
            background-color: #0e639c;
            color: white;
            border: none;
            text-align: center;
        }

        button:hover {
            background-color: #1177bb;
        }

        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .nav-buttons button {
            padding: 8px;
        }

        #tooltip {
            position: fixed;
            display: none;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 3000;
            pointer-events: none;
            border: 1px solid #555;
        }

        #context-menu {
            position: fixed;
            display: none;
            background: var(--dropdown-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            border-radius: 3px;
            z-index: 4000;
            min-width: 150px;
            padding: 4px 0;
        }

        .context-menu-item {
            padding: 8px 15px;
            cursor: pointer;
            font-size: 13px;
        }

        .context-menu-item:hover {
            background-color: #0e639c;
            color: white;
        }
    </style>
</head>
<body>
    <div id="header">
        <div id="title">Logical English Knowledge Graph</div>
        <div id="controls">
            <button id="btn-refresh-graph" title="Get the graph again from the program in the editor, after you change the program">Refresh</button>
            <button id="btn-copy-mermaid" title="Copy the visible graph as a Mermaid diagram (text), pasteable into GitHub, Obsidian, mermaid.live…">Copy Mermaid</button>
            <button id="btn-fit" title="Zoom and move the graph so that all of it shows in the window">Fit View</button>
            <button id="btn-center" title="Move the graph to the centre of the window, at the same zoom">Center</button>
            <button id="btn-zoom-in" title="Zoom in">+</button>
            <button id="btn-zoom-out" title="Zoom out">-</button>
            <input type="text" id="graph-search" placeholder="Search nodes..." title="Type words to find the boxes that contain them. The other boxes become pale.">
        </div>
    </div>
    <div id="main-container">
        <div id="sidebar">
            <div class="control-group">
                <label title="Show the facts of one scenario only, or of all the scenarios (None). The facts show when Facts and Scenarios are both selected below.">Scenario</label>
                <select id="scenario-select" title="Show the facts of one scenario only, or of all the scenarios (None). The facts show when Facts and Scenarios are both selected below.">
                    <option value="" title="All the scenarios">None</option>
                </select>
            </div>
            <div class="control-group">
                <label title="How the boxes are put on the page">Layout</label>
                <select id="layout-select" title="How the boxes are put on the page">
                    <option value="elk" title="In layers: each box is after the boxes that it uses">ELK (Layered)</option>
                    <option value="fcose" title="As a network: boxes that are connected come near each other">fCoSE (Default)</option>
                    <option value="dagre" title="As a hierarchy: each box is below or after the boxes that use it">Dagre (Hierarchical)</option>
                    <option value="grid" title="In rows and columns">Grid</option>
                    <option value="circle" title="On a circle">Circle</option>
                </select>
            </div>
            <div class="control-group">
                <label title="The direction of the layers, for the ELK and Dagre layouts">Direction</label>
                <select id="direction-select" title="The direction of the layers, for the ELK and Dagre layouts">
                    <option value="LR" title="From left to right">Horizontal (L→R)</option>
                    <option value="TB" title="From top to bottom">Vertical (T→B)</option>
                </select>
            </div>
            <div class="control-group">
                <label title="The kinds of box that show in the graph">Node Types</label>
                <div class="checkbox-group">
                    <label class="checkbox-item" title="Show the templates: the sentence patterns that the program declares, for example &quot;*a person* is happy&quot;"><input type="checkbox" data-type="template" checked> Templates</label>
                    <label class="checkbox-item" title="Show the rules: the sentences with &quot;if&quot; that conclude something from conditions"><input type="checkbox" data-type="rule" checked> Rules</label>
                    <label class="checkbox-item" title="Show the facts: the sentences without conditions, in the knowledge base and (with Scenarios) in the scenarios"><input type="checkbox" data-type="fact"> Facts</label>
                    <label class="checkbox-item" title="Show the scenarios: the sets of facts that describe one case each"><input type="checkbox" data-type="scenario"> Scenarios</label>
                    <label class="checkbox-item" title="Show the types: the kinds of thing in the templates (for example, a person), and which type is a kind of which"><input type="checkbox" data-type="type"> Types</label>
                    <label class="checkbox-item" title="Show the queries: the questions that the program declares"><input type="checkbox" data-type="query"> Queries</label>
                </div>
            </div>
            <div class="control-group">
                <label title="The kinds of line that show in the graph">Edge Types</label>
                <div class="checkbox-group">
                    <label class="checkbox-item" title="Show the lines from a rule, a fact or a query to each template that it uses"><input type="checkbox" data-type="uses" checked> Uses</label>
                    <label class="checkbox-item" title="Show the lines from a rule to the rules and facts that it depends on"><input type="checkbox" data-type="depends-on" checked> Depends-on</label>
                    <label class="checkbox-item" title="Show the lines from a rule to each template that it uses with &quot;it is not the case that&quot;"><input type="checkbox" data-type="negates" checked> Negates</label>
                    <label class="checkbox-item" title="Show the lines from a type to the type that it is a kind of"><input type="checkbox" data-type="is-a" checked> Is-a</label>
                </div>
            </div>
        </div>
        <div id="graph-container"><div id="graph-status"></div></div>
    </div>
    <div id="tooltip"></div>
    <div id="context-menu">
        <div class="context-menu-item" id="ctx-copy-node" title="Copy the text of this box to the clipboard">Copy Node</div>
        <div class="context-menu-item" id="ctx-copy-url" title="Copy a link that opens the graph on this box">Copy URL</div>
        <div class="context-menu-item" id="ctx-layout-from-here" title="Put the graph again as a tree that starts at this box">Redraw from here</div>
    </div>

    <script type="module">

        import './dist/graph-client.js';
    </script>
</body>
</html>
