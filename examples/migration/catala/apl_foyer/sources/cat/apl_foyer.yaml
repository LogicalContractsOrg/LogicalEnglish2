  catala_scope: CalculAidePersonnaliséeLogementFoyer
  dtype: Money
  kind: derived
  name: plafond_équivalence_loyer_éligible
  source: Article 27 | LEGIARTI000052233830; Article 27 | LEGIARTI000048109287 [archive];
    Article 27 | LEGIARTI000046206199 [archive]; Article 27 | LEGIARTI000044137406
    [archive]; Article 27 | LEGIARTI000042378428 [archive]; Article 27 | LEGIARTI000050286612
    [archive]
  source_document: sources/aides_logement/arrete_2019-09-27.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if ((date_courante >= date("2025-10-01"))): (match zone: ''Zone1''
      => (if (nombre_personnes_à_charge == 0): (match situation_familiale_calcul_apl:
      ''PersonneSeule'' => 498.81 ''Couple'' => 584.76) else: (if (nombre_personnes_à_charge
      == 1): 623.52 else: (if (nombre_personnes_à_charge == 2): 667.29 else: (if (nombre_personnes_à_charge
      == 3): 711.21 else: (767.12 + round((79.57 * (nombre_personnes_à_charge - 4)),
      2)))))) ''Zone2'' => (if (nombre_personnes_à_charge == 0): (match situation_familiale_calcul_apl:
      ''PersonneSeule'' => 456.15 ''Couple'' => 532.35) else: (if (nombre_personnes_à_charge
      == 1): 567.63 else: (if (nombre_personnes_à_charge == 2): 607.61 else: (if (nombre_personnes_à_charge
      == 3): 647.44 else: (689.89 + round((71.91 * (nombre_personnes_à_charge - 4)),
      2)))))) ''Zone3'' => (if (nombre_personnes_à_charge == 0): (match situation_familiale_calcul_apl:
      ''PersonneSeule'' => 432.98 ''Couple'' => 503.57) else: (if (nombre_personnes_à_charge
      == 1): 534.26 else: (if (nombre_personnes_à_charge == 2): 569.52 else: (if (nombre_personnes_à_charge
      == 3): 604.76 else: (644.41 + round((66.74 * (nombre_personnes_à_charge - 4)),
      2))))))) elif (((date_courante >= date("2023-10-01")) and (date_courante < date("2024-10-01")))):
      (match zone: ''Zone1'' => (if (nombre_personnes_à_charge == 0): (match situation_familiale_calcul_apl:
      ''PersonneSeule'' => 478.09 ''Couple'' => 560.47) else: (if (nombre_personnes_à_charge
      == 1): 597.62 else: (if (nombre_personnes_à_charge == 2): 639.57 else: (if (nombre_personnes_à_charge
      == 3): 681.67 else: (735.25 + round((76.26 * (nombre_personnes_à_charge - 4)),
      2)))))) ''Zone2'' => (if (nombre_personnes_à_charge == 0): (match situation_familiale_calcul_apl:
      ''PersonneSeule'' => 437.2 ''Couple'' => 510.24) else: (if (nombre_personnes_à_charge
      == 1): 544.05 else: (if (nombre_personnes_à_charge == 2): 582.37 else: (if (nombre_personnes_à_charge
      == 3): 620.55 else: (661.23 + round((68.92 * (nombre_personnes_à_charge - 4)),
