  dtype: Decimal
  kind: derived
  name: coefficient_prise_en_charge_d832_25_coeff_arrondi
  source: Article D832-25 | LEGIARTI000047401364
  source_document: sources/aides_logement/code_construction_reglementaire.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if (condition_2_du_832_25): (round(((coefficient_prise_en_charge_d832_25_formule
      - 0.005) * 100.0)) / 100.0) else: (round(((coefficient_prise_en_charge_d832_25_formule
      - 0.005) * 100.0)) / 100.0))'
- catala_scope: CalculAidePersonnaliséeLogementFoyer
  dtype: Decimal
  kind: derived
  name: coefficient_prise_en_charge_d832_25_formule
  source: Article D832-25 | LEGIARTI000047401364
  source_document: sources/aides_logement/code_construction_reglementaire.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if (condition_2_du_832_25): (0.9 - (ressources_ménage_arrondies / round((coefficient_multiplicateur_d832_25
      * n_nombre_parts_d832_25), 2))) else: (0.95 - ((if ((ressources_ménage_arrondies
      - round((coefficient_r_d832_25 * n_nombre_parts_d832_25), 2)) < 0): 0 else:
      (ressources_ménage_arrondies - round((coefficient_r_d832_25 * n_nombre_parts_d832_25),
      2))) / round((coefficient_multiplicateur_d832_25 * n_nombre_parts_d832_25),
      2))))'
