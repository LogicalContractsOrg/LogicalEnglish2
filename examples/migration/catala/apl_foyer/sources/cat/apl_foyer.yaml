  source_document: sources/aides_logement/code_construction_reglementaire.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if (calcul_nombre_parts_condition_2_du_832_25): (if (calcul_nombre_parts_nombre_personnes_à_charge
      == 0): (match calcul_nombre_parts_situation_familiale_calcul_apl: ''PersonneSeule''
      => 1.2 ''Couple'' => 1.5) else: (if (calcul_nombre_parts_nombre_personnes_à_charge
      == 1): 2.5 else: (if (calcul_nombre_parts_nombre_personnes_à_charge == 2): 3.0
      else: (if (calcul_nombre_parts_nombre_personnes_à_charge == 3): 3.7 else: 4.3))))
      else: (if (calcul_nombre_parts_nombre_personnes_à_charge == 0): (match calcul_nombre_parts_situation_familiale_calcul_apl:
      ''PersonneSeule'' => 1.4 ''Couple'' => 1.8) else: (if (calcul_nombre_parts_nombre_personnes_à_charge
      == 1): 2.5 else: (if (calcul_nombre_parts_nombre_personnes_à_charge == 2): 3.0
      else: (if (calcul_nombre_parts_nombre_personnes_à_charge == 3): 3.7 else: 4.3)))))'
