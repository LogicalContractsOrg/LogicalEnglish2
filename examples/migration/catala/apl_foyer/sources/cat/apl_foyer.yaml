- catala_scope: CalculÉquivalenceLoyerMinimale
  catala_source: "  définition tranches_revenus_d832_26 égal à\n    [\n      TrancheRevenu
    {\n        -- haut: LimiteTranche.Revenu contenu 1948,10€\n        -- bas: 0€\n
    \       -- taux: 4%\n      };\n      TrancheRevenu {\n        -- haut: LimiteTranche.Revenu
    contenu 2678,71€\n        -- bas: 1948,10€\n        -- taux: 10,40%\n      };\n
    \     TrancheRevenu {\n        -- haut: LimiteTranche.Revenu contenu 3896,18€\n
    \       -- bas: 2678,71€\n        -- taux: 21,60%\n      };\n      TrancheRevenu
    {\n        -- haut: LimiteTranche.Revenu contenu 5 357,44€\n        -- bas: 3896,18€\n
    \       -- taux: 26,40%\n      };\n      TrancheRevenu {\n        -- haut: LimiteTranche.Revenu
    contenu 6 331,29€\n        -- bas: 5 357,44€\n        -- taux: 32%\n      };\n
    \     TrancheRevenu {\n        -- haut: LimiteTranche.Infini\n        -- bas:
    6 331,29€\n        -- taux: 48%\n      };\n    ]\n  exception"
  dtype: Judgment
  entity: TrancheRevenu
  kind: derived
  name: is_in_calcul_équivalence_loyer_minimale_tranches_revenus_d832_26
  residue_reason: a list
  source: Article 31 | LEGIARTI000046126968
