- catala_scope: CalculÉquivalenceLoyerMinimale
  catala_source: "  définition tranches_revenus_d832_26_multipliées égal à\n    transforme
    chaque tranche parmi tranches_revenus_d832_26 en\n      TrancheRevenuDécimal {\n
    \       -- haut:\n          (\n            selon tranche.haut sous forme\n            --
    LimiteTranche.Infini : LimiteTrancheDécimal.Infini\n            -- LimiteTranche.Revenu
    contenu tranche_haut :\n              LimiteTrancheDécimal.Revenu contenu ((décimal
    de tranche_haut) * n_nombre_parts_d832_25)\n          )\n        -- bas:\n          décimal
    de tranche.bas\n          * n_nombre_parts_d832_25\n        -- taux: tranche.taux\n
    \     }\n"
  dtype: Judgment
  entity: TrancheRevenuDécimal
  kind: derived
  name: is_in_calcul_équivalence_loyer_minimale_tranches_revenus_d832_26_multipliées
  residue_reason: a list transformed
  source: Article D832-26 | LEGIARTI000047401357
  source_document: sources/aides_logement/code_construction_reglementaire.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: 0
