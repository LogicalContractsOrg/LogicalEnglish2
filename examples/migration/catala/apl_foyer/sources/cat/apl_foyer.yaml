    [archive]
  source_document: sources/aides_logement/code_construction_reglementaire.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if (((calcul_nombre_parts_date_courante >= date("2019-09-01")) and
      (calcul_nombre_parts_date_courante < date("2023-04-05"))) and (calcul_nombre_parts_limitation_majoration_personnes_à_charge
      and (calcul_nombre_parts_nombre_personnes_à_charge > 6))): 1.0 elif (calcul_nombre_parts_condition_2_du_832_25):
      (if (calcul_nombre_parts_nombre_personnes_à_charge > 4): (0.5 * (calcul_nombre_parts_nombre_personnes_à_charge
      - 4)) else: 0.0) else: (if (calcul_nombre_parts_nombre_personnes_à_charge >
      4): (0.5 * (calcul_nombre_parts_nombre_personnes_à_charge - 4)) else: 0.0))'
