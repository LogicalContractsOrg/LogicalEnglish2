  catala_source: "  définition montant égal à\n    soit ressources_ménage_arrondies
    égal à\n      décimal de ressources_ménage_arrondies\n    dans\n    argent de\n
    \     (\n        (\n          (\n            Décimal.somme de\n              (\n
    \               transforme chaque tranche parmi tranches_revenus_d832_26_multipliées
    en\n                  (\n                    si ressources_ménage_arrondies <=
    tranche.bas alors 0,0\n                    sinon\n                      selon
    tranche.haut sous forme\n                      -- LimiteTrancheDécimal.Revenu
    contenu tranche_haut :\n                        (\n                          si
    ressources_ménage_arrondies >= tranche_haut alors\n                            (tranche_haut
    - tranche.bas)\n                            * tranche.taux\n                          sinon\n
    \                           (ressources_ménage_arrondies - tranche.bas)\n                            *
    tranche.taux\n                        )\n                      -- LimiteTrancheDécimal.Infini
    :\n                        (ressources_ménage_arrondies - tranche.bas)\n                        *
    tranche.taux\n                  )\n              )\n          )\n          + décimal
    de montant_forfaitaire_d832_26\n            * n_nombre_parts_d832_25\n        )\n
    \       / 12,0\n      )\n  exception"
