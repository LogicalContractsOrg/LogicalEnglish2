  name: aide_finale_formule_initiale
  source: Article D832-10 | LEGIARTI000038878746
  source_document: sources/aides_logement/code_construction_reglementaire.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if (round((((mensualité_éligible + montant_forfaitaire_charges_d832_10)
      - mensualité_minimale) * coefficient_prise_en_charge_d832_10), 2) < 0): 0 else:
      round((((mensualité_éligible + montant_forfaitaire_charges_d832_10) - mensualité_minimale)
      * coefficient_prise_en_charge_d832_10), 2))'
