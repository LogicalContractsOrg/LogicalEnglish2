  catala_source: "  définition coefficients_enfants_garde_alternée_pris_en_compte
    égal à\n  (\n    transforme chaque personne_à_charge parmi personnes_à_charge_prises_en_compte\n
    \     tel que (\n        selon personne_à_charge sous forme\n        -- AutrePersonneÀCharge
    : faux\n        -- EnfantÀCharge contenu enfant :\n          (\n            selon
    enfant.situation_garde_alternée sous forme\n            -- GardeAlternéeCoefficientPriseEnCharge
    : vrai\n            -- PasDeGardeAlternée : faux\n          )\n      )\n    en\n
    \     selon personne_à_charge sous forme\n      -- AutrePersonneÀCharge : 0,0\n
    \     -- EnfantÀCharge contenu enfant :\n        (\n          selon enfant.situation_garde_alternée
    sous forme\n          -- GardeAlternéeCoefficientPriseEnCharge contenu coeff :
    coeff\n          -- PasDeGardeAlternée : 0,0\n        )\n  )\n  # Ce programme
    ne peut pas être utilisé avec des dates trop anciennes,\n  # pour lesquelles les
    textes en vigueur n'ont pas été formalisés."
