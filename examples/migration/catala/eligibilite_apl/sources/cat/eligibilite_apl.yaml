format: rulespec/v1
module:
  summary: Scopes of catala-examples, lowered for the twin builder.
  title: Catala scope(s) ÉligibilitéAidePersonnaliséeLogement
rules:
- approximated: where two of its definitions at one level both apply, Catala stops
    with a conflict; the twin takes the first
  catala_scope: ÉligibilitéAidePersonnaliséeLogement
  dtype: Judgment
  entity: Prêt
  kind: derived
  name: caractéristiques_prêt_l831_1_1
  source: Article R832-5 | LEGIARTI000039048901; Article R832-7 | LEGIARTI000039048899
  source_document: sources/aides_logement/code_construction_reglementaire.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if (((titulaire_prêt == ''Demandeur'') and ((type_prêt == ''D331_32'')
      or (type_prêt == ''D331_63_64'')))): true elif (((titulaire_prêt == ''VendeurQuandDemandeurAContratLocationAccession'')
      and ((type_prêt == ''D331_59_8'') or (type_prêt == ''D331_76_1'')))): true else:
      false)'
- catala_scope: ÉligibilitéAidePersonnaliséeLogement
  dtype: Judgment
  entity: Prêt
