format: rulespec/v1
module:
  summary: Scopes of catala-examples, lowered for the twin builder.
  title: Catala scope(s) Section121SinglePerson, Section121TwoPersons
rules:
- catala_scope: Section121SinglePerson
  catala_source: "  definition aggregate_periods_from_last_five_years of periods equals\n
    \   Duration.sum of\n      (\n        map each period among periods to\n          if
    date_of_sale_or_exchange <= period.begin + 5 year then\n            period.end
    - period.begin\n          else\n            (\n              if date_of_sale_or_exchange
    >= period.end + 5 year then\n                0 day\n              else ((period.end
    + 5 year) - date_of_sale_or_exchange)\n            )\n      )\n\n  # Regulation
    1.121-1(c)(1): 2 years = 730 days\n  # Regulation 1.121-1(c)(1): the periods of
    ownage and usage\n  # don't have to overlap"
  dtype: Decimal
  kind: derived
  name: section121_single_person_aggregate_periods_from_last_five_years
  residue_reason: a function of its parameters
  source: (a) Exclusion
  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: 0
- catala_scope: Section121SinglePerson
  dtype: Date
  kind: input
  name: section121_single_person_date_of_sale_or_exchange
- catala_scope: Section121SinglePerson
  dtype: Money
  kind: derived
  name: section121_single_person_gain_cap
  overridable: true
  source: (1) In general
  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: !!str 250000
- catala_scope: Section121SinglePerson
  dtype: Money
  kind: input
  name: section121_single_person_gain_from_sale_or_exchange_of_property
- catala_scope: Section121SinglePerson
  dtype: Money
  kind: derived
  name: section121_single_person_income_excluded_from_gross_income
  source: (1) In general
  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: '(if (section121_single_person_income_excluded_from_gross_income_uncapped
      >= section121_single_person_gain_cap): section121_single_person_gain_cap else:
      section121_single_person_income_excluded_from_gross_income_uncapped)'
- catala_scope: Section121SinglePerson
  dtype: Money
  kind: derived
  name: section121_single_person_income_excluded_from_gross_income_uncapped
  source: (a) Exclusion; (3) Application to only 1 sale or exchange every 2 years
  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: '(if (section121_single_person_section_121_b_3_applies): 0 else: (if
      section121_single_person_requirements_met: section121_single_person_gain_from_sale_or_exchange_of_property
      else: 0))'
- catala_scope: Section121SinglePerson
  dtype: Text
  kind: input
  name: section121_single_person_other_section_121a_sale
- catala_scope: Section121SinglePerson
  dtype: Decimal
  kind: input
  name: section121_single_person_property_ownage
- catala_scope: Section121SinglePerson
  dtype: Decimal
  kind: input
  name: section121_single_person_property_usage_as_principal_residence
- catala_scope: Section121SinglePerson
  dtype: Judgment
  kind: derived
  name: section121_single_person_requirements_met
  source: (a) Exclusion
  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: '(if ((section121_single_person_requirements_ownership_met and section121_single_person_requirements_usage_met)):
      true else: false)'
- catala_scope: Section121SinglePerson
  catala_source: "  rule requirements_ownership_met\n  under condition aggregate_periods_from_last_five_years
    of property_ownage >= 730 day\n  consequence fulfilled\n"
  dtype: Judgment
  kind: derived
  name: section121_single_person_requirements_ownership_met
  residue_reason: a function call
  source: (a) Exclusion
  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: 0
- catala_scope: Section121SinglePerson
  catala_source: "  rule requirements_usage_met\n  under condition\n    aggregate_periods_from_last_five_years
    of\n      property_usage_as_principal_residence\n    >= 730 day\n  consequence
    fulfilled\n"
  dtype: Judgment
  kind: derived
  name: section121_single_person_requirements_usage_met
  residue_reason: a function call
  source: (a) Exclusion
  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: 0
- catala_scope: Section121SinglePerson
  catala_source: "  rule section_121_b_3_applies\n  under condition\n    other_section_121a_sale\n
    \   with pattern MostRecentSaleWhereSection121aApplied content other_sale\n    and
    date_of_sale_or_exchange - other_sale.date_of_sale_or_exchange <= 2 year\n  consequence
    fulfilled\n"
  dtype: Judgment
  kind: derived
  name: section121_single_person_section_121_b_3_applies
  overridable: true
  residue_reason: 'an expression this translator does not read: test_case(id([],other_section_121a_sale,none),[],''MostRecentSaleWhereSection121aApplied'',[other_sale])'
  source: (3) Application to only 1 sale or exchange every 2 years
  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: 0
