  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: '(if (section121_single_person_income_excluded_from_gross_income_uncapped
      >= section121_single_person_gain_cap): section121_single_person_gain_cap else:
      section121_single_person_income_excluded_from_gross_income_uncapped)'
- catala_scope: Section121SinglePerson
  dtype: Money
  kind: derived
  name: section121_single_person_income_excluded_from_gross_income_uncapped
  source: (a) Exclusion; (3) Application to only 1 sale or exchange every 2 years
  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: '(if (section121_single_person_section_121_b_3_applies): 0 else: (if
      section121_single_person_requirements_met: section121_single_person_gain_from_sale_or_exchange_of_property
      else: 0))'
- catala_scope: Section121SinglePerson
  dtype: Text
  kind: input
  name: section121_single_person_other_section_121a_sale
- catala_scope: Section121SinglePerson
  dtype: Date
  kind: input
  name: section121_single_person_other_section_121a_sale_MostRecentSaleWhereSection121aApplied_date_of_sale_or_exchange
- catala_scope: Section121SinglePerson
  dtype: Judgment
  kind: derived
  name: section121_single_person_requirements_met
  source: (a) Exclusion
  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: '(if ((section121_single_person_requirements_ownership_met and section121_single_person_requirements_usage_met)):
      true else: false)'
- catala_scope: Section121SinglePerson
  dtype: Judgment
  kind: derived
  name: section121_single_person_requirements_ownership_met
  source: (a) Exclusion
  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: '(if ((sum_over(Period, is_in_section121_single_person_property_ownage,
      (if (section121_single_person_date_of_sale_or_exchange <= add_months(begin,
      60)): days_between(begin, end) else: (if (section121_single_person_date_of_sale_or_exchange
      >= add_months(end, 60)): 0 else: days_between(section121_single_person_date_of_sale_or_exchange,
      add_months(end, 60))))) >= 730)): true else: false)'
- catala_scope: Section121SinglePerson
  dtype: Judgment
  kind: derived
  name: section121_single_person_requirements_usage_met
  source: (a) Exclusion
  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: '(if ((sum_over(Period, is_in_section121_single_person_property_usage_as_principal_residence,
      (if (section121_single_person_date_of_sale_or_exchange <= add_months(begin,
      60)): days_between(begin, end) else: (if (section121_single_person_date_of_sale_or_exchange
      >= add_months(end, 60)): 0 else: days_between(section121_single_person_date_of_sale_or_exchange,
      add_months(end, 60))))) >= 730)): true else: false)'
- catala_scope: Section121SinglePerson
  dtype: Judgment
  kind: derived
  name: section121_single_person_section_121_b_3_applies
  overridable: true
  source: (3) Application to only 1 sale or exchange every 2 years
  source_document: sources/us_tax_code/section_121.catala_en
  versions:
  - effective_from: 1900-01-01
    formula: '(if (((section121_single_person_other_section_121a_sale == ''MostRecentSaleWhereSection121aApplied'')
      and (section121_single_person_date_of_sale_or_exchange <= add_months(section121_single_person_other_section_121a_sale_MostRecentSaleWhereSection121aApplied_date_of_sale_or_exchange,
      24)))): true else: false)'
