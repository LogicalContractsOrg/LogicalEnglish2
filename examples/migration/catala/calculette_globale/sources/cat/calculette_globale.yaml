- catala_scope: ÉligibilitéAllocationLogement
  catala_source: "  règle éligibilité_allocation_logement_familiale\n  sous condition\n
    \   l_841_1_1_applicable\n    et existe prestation parmi ménage.prestations_reçues\n
    \       tel que (\n          prestation = PrestationReçue.AllocationsFamiliales\n
    \         ou prestation = PrestationReçue.ComplémentFamilial\n          ou prestation
    = PrestationReçue.AllocationSoutienFamilial\n          ou prestation = AllocationSoutienEnfantHandicapé\n
    \       )\n  conséquence rempli\n  règle éligibilité_allocation_logement_familiale\n
    \ sous condition\n    l_841_1_2_applicable\n    et nombre de\n        (\n          liste
    de personne_à_charge parmi ménage.personnes_à_charge\n            tel que (\n
    \             selon personne_à_charge sous forme\n              -- AutrePersonneÀCharge
    : faux\n              -- EnfantÀCharge contenu enfant :\n                prestations_familiales.droit_ouvert
    de\n                  Prestations_familiales.EnfantPrestationsFamiliales {\n                    --
    identifiant: enfant.identifiant\n                    -- obligation_scolaire: enfant.obligation_scolaire\n
    \                   -- rémuneration_mensuelle: enfant.rémuneration_mensuelle\n
    \                   -- date_de_naissance: enfant.date_de_naissance\n                    --
    a_déjà_ouvert_droit_aux_allocations_familiales:\n                      enfant.a_déjà_ouvert_droit_aux_allocations_familiales\n
    \                 }\n            )\n        )\n      = 1\n  conséquence rempli\n
    \ règle éligibilité_allocation_logement_familiale\n  sous condition\n    nombre
    de\n      (\n        liste de personne_à_charge parmi ménage.personnes_à_charge\n
    \         tel que (\n            selon personne_à_charge sous forme\n            --
    AutrePersonneÀCharge : faux\n            -- EnfantÀCharge contenu enfant :\n              non
    (\n                prestations_familiales.droit_ouvert de\n                  Prestations_familiales.EnfantPrestationsFamiliales
    {\n                    -- identifiant: enfant.identifiant\n                    --
    obligation_scolaire: enfant.obligation_scolaire\n                    -- rémuneration_mensuelle:
    enfant.rémuneration_mensuelle\n                    -- date_de_naissance: enfant.date_de_naissance\n
    \                   -- a_déjà_ouvert_droit_aux_allocations_familiales:\n                      enfant.a_déjà_ouvert_droit_aux_allocations_familiales\n
    \                 }\n              )\n          )\n      )\n    = 0\n    et (\n
    \     selon ménage.situation_familiale sous forme\n      # VERIF: opération ambiguë\n
    \     -- Mariés contenu date_mariage : date_courante <= date_mariage + durée_l841_1_3\n
    \     -- n'importe quel : faux\n    )\n  conséquence rempli\n  règle éligibilité_allocation_logement_familiale\n
    \ sous condition\n    existe personne_à_charge parmi ménage.personnes_à_charge\n
    \     tel que éligibilité_commune.condition_2_r823_4 de personne_à_charge\n  conséquence
    rempli\n  règle éligibilité_allocation_logement_familiale\n  sous condition\n
    \   existe personne_à_charge parmi ménage.personnes_à_charge\n      tel que (\n
    \       selon personne_à_charge sous forme\n        -- AutrePersonneÀCharge contenu
    parent :\n          # Cela a l'air similaire au 3° du R823-4 code construction
    mais\n          # ici le pourcentage est \"fixé par voie réglementaire\" au lieu
    d'être\n          # fixé à 80%.\n          # TODO juridique: vérifier si ce pourcentage
    fixé par voie réglementaire\n          # est bien égal à 80%.\n          parent.ascendant_descendant_collatéral_deuxième_troisième_degré\n
    \         et parent.incapacité_80_pourcent_ou_restriction_emploi\n        -- EnfantÀCharge
    contenu enfant : faux\n      )\n  conséquence rempli\n  règle éligibilité_allocation_logement_familiale\n
    \ sous condition\n    l_841_1_6_applicable\n    et selon ménage.situation_familiale
    sous forme\n      -- Célibataire :\n        nombre de ménage.personnes_à_charge
    = 0\n        et ménage.enfant_à_naître_après_quatrième_mois_grossesse\n      --
    n'importe quel : faux\n  conséquence rempli\n  règle éligibilité_allocation_logement_familiale\n
    \ sous condition\n    nombre de\n      (\n        liste de personne_à_charge parmi
    ménage.personnes_à_charge\n          tel que (\n            selon personne_à_charge
    sous forme\n            -- AutrePersonneÀCharge : faux\n            -- EnfantÀCharge
    contenu enfant :\n              prestations_familiales.droit_ouvert de\n                Prestations_familiales.EnfantPrestationsFamiliales
    {\n                  -- identifiant: enfant.identifiant\n                  --
    obligation_scolaire: enfant.obligation_scolaire\n                  -- rémuneration_mensuelle:
    enfant.rémuneration_mensuelle\n                  -- date_de_naissance: enfant.date_de_naissance\n
    \                 -- a_déjà_ouvert_droit_aux_allocations_familiales:\n                    enfant.a_déjà_ouvert_droit_aux_allocations_familiales\n
    \               }\n          )\n      )\n    >= 1\n  conséquence rempli\n  règle
    éligibilité_allocation_logement_familiale\n  sous condition demandeur.est_non_salarié_agricole_l781_8_l_781_46_code_rural\n
    \ conséquence rempli\n  règle éligibilité_allocation_logement_familiale\n  sous
    condition\n    nombre de\n      (\n        liste de personne_à_charge parmi ménage.personnes_à_charge\n
    \         tel que (\n            selon personne_à_charge sous forme\n            --
    AutrePersonneÀCharge : faux\n            -- EnfantÀCharge contenu enfant :\n              prestations_familiales.droit_ouvert
    de\n                Prestations_familiales.EnfantPrestationsFamiliales {\n                  --
    identifiant: enfant.identifiant\n                  -- obligation_scolaire: enfant.obligation_scolaire\n
    \                 -- rémuneration_mensuelle: enfant.rémuneration_mensuelle\n                  --
    date_de_naissance: enfant.date_de_naissance\n                  -- a_déjà_ouvert_droit_aux_allocations_familiales:\n
    \                   enfant.a_déjà_ouvert_droit_aux_allocations_familiales\n                }\n
    \         )\n      )\n    >= 1\n  conséquence rempli\n  règle éligibilité_allocation_logement_familiale\n
    \ sous condition demandeur.est_non_salarié_agricole_l781_8_l_781_46_code_rural\n
    \ conséquence rempli"
