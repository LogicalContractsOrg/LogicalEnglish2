- catala_scope: CalculetteAidesAuLogement
  dtype: Money
  kind: derived
  name: aide_finale_formule_initiale
  source: Article L841-2 | LEGIARTI000038814862
  source_document: sources/aides_logement/code_construction_legislatif.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if (not éligibilité): 0 else: (if (éligibilité_aide_personnalisée_logement_éligibilité
      and (not (éligibilité_allocation_logement_éligibilité == ''PasÉligible''))):
      (if (calcul_aide_personnalisée_logement_traitement_aide_finale_de_valeur_4585
      > calcul_allocation_logement_traitement_aide_finale_de_valeur_7649): calcul_aide_personnalisée_logement_aide_finale_formule_initiale
      else: calcul_allocation_logement_aide_finale_formule_initiale) else: (if éligibilité_aide_personnalisée_logement_éligibilité:
      calcul_aide_personnalisée_logement_aide_finale_formule_initiale else: calcul_allocation_logement_aide_finale_formule_initiale)))'
