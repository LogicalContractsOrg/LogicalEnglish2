- catala_scope: ÉligibilitéAidePersonnaliséeLogement
  catala_source: "  règle condition_logement_bailleur\n  sous condition\n    selon
    ménage.logement.mode_occupation sous forme\n    -- AccessionPropriétéLocalUsageExclusifHabitation
    contenu propriété :\n      caractéristiques_prêt_l831_1_1 de propriété.prêt\n
    \   -- n'importe quel : faux\n  conséquence rempli\n  règle condition_logement_bailleur\n
    \ sous condition\n    selon ménage.logement.mode_occupation sous forme\n    --
    Locataire contenu location :\n      (\n        selon location.bailleur sous forme\n
    \       -- BailleurSocial contenu convention :\n          convention.\n            conventionné_livre_III_titre_V_chap_III\n
    \       -- BailleurPrivéAvecConventionnementSocial contenu convention :\n          convention.conventionné_livre_III_titre_II_chap_I_sec_3\n
    \       -- n'importe quel : faux\n      )\n    -- n'importe quel : faux\n  conséquence
    rempli\n  étiquette logement_foyer\n  règle condition_logement_bailleur\n  sous
    condition\n    selon ménage.logement.mode_occupation sous forme\n    -- LocationAccession
    contenu propriété :\n      caractéristiques_prêt_l831_1_6 de propriété.prêt\n
    \   -- n'importe quel : faux\n  conséquence rempli\n  étiquette logement_foyer\n
    \ exception logement_foyer\n  étiquette logement_foyer\n  exception logement_foyer"
  dtype: Judgment
  kind: derived
  name: éligibilité_aide_personnalisée_logement_condition_logement_bailleur
  residue_reason: a function call
  source: Article L831-1 | LEGIARTI000038814882; Article L861-5-1 | LEGIARTI000044899551;
    Article R832-20 | LEGIARTI000038878722; Article R832-21 | LEGIARTI000039048891;
    Article R861-20 | LEGIARTI000047398875
  source_document: sources/aides_logement/code_construction_legislatif.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: 0
- catala_scope: ÉligibilitéAidePersonnaliséeLogement
  dtype: Judgment
  kind: derived
  name: éligibilité_aide_personnalisée_logement_condition_logement_prêt
  source: Article L831-2 | LEGIARTI000038814880
  source_document: sources/aides_logement/code_construction_legislatif.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if ((match éligibilité_aide_personnalisée_logement_ménage_logement_mode_occupation:
      ''LocationAccession'' => ((éligibilité_aide_personnalisée_logement_ménage_logement_mode_occupation_LocationAccession_prêt_date_signature
      >= date("2018-01-01")) and ((éligibilité_aide_personnalisée_logement_ménage_logement_mode_occupation_LocationAccession_prêt_date_signature
      < date("2020-01-01")) and ((éligibilité_aide_personnalisée_logement_ménage_logement_mode_occupation_LocationAccession_ancienneté_logement
      == ''Ancien'') and éligibilité_aide_personnalisée_logement_logement_situé_commune_déséquilibre_l831_2)))
      ''AccessionPropriétéLocalUsageExclusifHabitation'' => ((éligibilité_aide_personnalisée_logement_ménage_logement_mode_occupation_AccessionPropriétéLocalUsageExclusifHabitation_prêt_date_signature
      >= date("2018-01-01")) and ((éligibilité_aide_personnalisée_logement_ménage_logement_mode_occupation_AccessionPropriétéLocalUsageExclusifHabitation_prêt_date_signature
      < date("2020-01-01")) and ((éligibilité_aide_personnalisée_logement_ménage_logement_mode_occupation_AccessionPropriétéLocalUsageExclusifHabitation_ancienneté_logement
      == ''Ancien'') and éligibilité_aide_personnalisée_logement_logement_situé_commune_déséquilibre_l831_2)))
      _ => false)): true elif ((match éligibilité_aide_personnalisée_logement_ménage_logement_mode_occupation:
      ''LocationAccession'' => (éligibilité_aide_personnalisée_logement_ménage_logement_mode_occupation_LocationAccession_prêt_date_signature
      >= date("2017-12-31")) ''AccessionPropriétéLocalUsageExclusifHabitation'' =>
      (éligibilité_aide_personnalisée_logement_ménage_logement_mode_occupation_AccessionPropriétéLocalUsageExclusifHabitation_prêt_date_signature
      >= date("2017-12-31")) _ => false)): false else: true)'
