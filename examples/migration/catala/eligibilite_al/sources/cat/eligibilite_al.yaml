format: rulespec/v1
module:
  summary: Scopes of catala-examples, lowered for the twin builder.
  title: Catala scope(s) ÉligibilitéAllocationLogement
rules:
- catala_scope: ÉligibilitéAllocationLogement
  dtype: Judgment
  kind: input
  name: bénéficie_aide_personnalisée_logement
- catala_scope: ÉligibilitéAllocationLogement
  dtype: Decimal
  kind: derived
  must:
  - (not (demandeur_personne_hébergée_centre_soin_l_L162_22_3_sécurité_sociale and
    ((ménage_logement_mode_occupation == 'AccessionPropriétéLocalUsageExclusifHabitation')
    or demandeur_magistrat_fonctionnaire_centre_intérêts_matériels_familiaux_hors_mayotte)))
  name: coefficients_enfants_garde_alternée_pris_en_compte
  source: Éligibilité aux allocations de logement
  source_document: sources/aides_logement/prologue.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: éligibilité_commune_coefficients_enfants_garde_alternée_pris_en_compte
- approximated: where two of its definitions at one level both apply, Catala stops
    with a conflict; the twin takes the first
  catala_scope: ÉligibilitéAllocationLogement
  dtype: Judgment
  kind: derived
  name: condition_accession_propriété
  source: Article R842-5 | LEGIARTI000039048889
  source_document: sources/aides_logement/code_construction_reglementaire.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if ((match ménage_logement_mode_occupation: ''AccessionPropriétéLocalUsageExclusifHabitation''
      => ((ménage_logement_mode_occupation_AccessionPropriétéLocalUsageExclusifHabitation_prêt_titulaire_prêt
      == ''Demandeur'') and ((ménage_logement_mode_occupation_AccessionPropriétéLocalUsageExclusifHabitation_type_travaux_logement_r842_5
      == ''PasDeTravaux'') or (ménage_logement_mode_occupation_AccessionPropriétéLocalUsageExclusifHabitation_type_travaux_logement_r842_5
      == ''ObjectifDécenceLogement''))) _ => false)): true elif ((match ménage_logement_mode_occupation:
      ''AccessionPropriétéLocalUsageExclusifHabitation'' => ((ménage_logement_mode_occupation_AccessionPropriétéLocalUsageExclusifHabitation_prêt_titulaire_prêt
      == ''Demandeur'') and (ménage_logement_mode_occupation_AccessionPropriétéLocalUsageExclusifHabitation_type_travaux_logement_r842_5
      == ''PrévuDansListeR321_15'')) _ => false)): true elif ((match ménage_logement_mode_occupation:
      ''AccessionPropriétéLocalUsageExclusifHabitation'' => ((ménage_logement_mode_occupation_AccessionPropriétéLocalUsageExclusifHabitation_prêt_titulaire_prêt
      == ''Demandeur'') and (ménage_logement_mode_occupation_AccessionPropriétéLocalUsageExclusifHabitation_type_travaux_logement_r842_5
      == ''AgrandirOuRendreHabitableD331_63'')) _ => false)): true elif ((not ((ménage_logement_mode_occupation
      == ''AccessionPropriétéLocalUsageExclusifHabitation'')))): true else: false)'
