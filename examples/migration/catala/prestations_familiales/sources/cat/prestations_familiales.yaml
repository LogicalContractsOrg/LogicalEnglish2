  source_document: sources/prestations_familiales/sécurité_sociale_L.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if (((résidence == ''Guadeloupe'') or ((résidence == ''Guyane'') or
      ((résidence == ''Martinique'') or ((résidence == ''LaRéunion'') or ((résidence
      == ''SaintBarthélemy'') or (résidence == ''SaintMartin''))))))): true else:
      false)'
