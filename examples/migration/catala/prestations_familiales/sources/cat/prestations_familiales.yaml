format: rulespec/v1
module:
  summary: Scopes of catala-examples, lowered for the twin builder.
  title: Catala scope(s) ÉligibilitéPrestationsFamiliales
rules:
- catala_scope: ÉligibilitéPrestationsFamiliales
  dtype: Judgment
  entity: EnfantPrestationsFamiliales
  kind: derived
  name: conditions_hors_âge
  source: Article L512-3 | LEGIARTI000041979743
  source_document: sources/prestations_familiales/sécurité_sociale_L.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if ((((obligation_scolaire == ''Avant'') or ((obligation_scolaire ==
      ''Pendant'') or (obligation_scolaire == ''Après''))) and (rémuneration_mensuelle
      <= plafond_l512_3_2))): true else: false)'
- catala_scope: ÉligibilitéPrestationsFamiliales
  dtype: Date
  kind: input
  name: date_courante
- dtype: Date
  entity: EnfantPrestationsFamiliales
  kind: input
  name: date_de_naissance
- approximated: where two of its definitions at one level both apply, Catala stops
    with a conflict; the twin takes the first
  catala_scope: ÉligibilitéPrestationsFamiliales
  dtype: Judgment
  entity: EnfantPrestationsFamiliales
  kind: derived
  name: droit_ouvert
  source: Article L512-3 | LEGIARTI000041979743
  source_document: sources/prestations_familiales/sécurité_sociale_L.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if (((obligation_scolaire == ''Avant'') or (obligation_scolaire ==
      ''Pendant''))): true elif (((obligation_scolaire == ''Après'') and ((rémuneration_mensuelle
      <= plafond_l512_3_2) and (add_months(date_de_naissance, âge_l512_3_2) > date_courante)))):
      true else: false)'
- dtype: Text
  entity: EnfantPrestationsFamiliales
  kind: input
  name: obligation_scolaire
- catala_scope: ÉligibilitéPrestationsFamiliales
  dtype: Money
  kind: derived
  name: plafond_l512_3_2
