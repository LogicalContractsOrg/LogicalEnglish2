  source_document: sources/prestations_familiales/sécurité_sociale_R.catala_fr
  versions:
  - effective_from: 1900-01-01
    formula: '(if (régime_outre_mer_l751_1): round((round((smic_brut_horaire * 0.55),
      2) * 169.0), 2) else: round((round((smic_brut_horaire * 0.55), 2) * 169.0),
      2))'
- catala_scope: ÉligibilitéPrestationsFamiliales
