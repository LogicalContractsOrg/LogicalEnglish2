    source_sha256: a3bbb6b3c5a09419403486d40f2836bcdcea5fff3ef042cd87195d0c953000cb
  summary: 'SNAP monthly income eligibility standards for October 1, 2023, to

    September 30, 2024, list net limits at 100 percent of poverty, gross

    limits at 130 percent, and separate-household elderly/disabled gross

    limits at 165 percent for the 48 States, DC, Guam, Virgin Islands,

    Alaska, and Hawaii.'
