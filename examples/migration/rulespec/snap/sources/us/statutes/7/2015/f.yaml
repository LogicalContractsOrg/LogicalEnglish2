        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-3
          excerpt: Section 10108 of the OBBB was effective upon enactment, July 4,
            2025.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/7/2015/f
          excerpt: The income (less, at State option, a pro rata share) and financial
            resources of the individual rendered ineligible
      - path: versions[0].formula
        kind: import
        import:
          target: us:statutes/7/2015/f#individual_ineligible_for_snap_participation_due_to_residence_or_status
          output: individual_ineligible_for_snap_participation_due_to_residence_or_status
          hash: sha256:local
  versions:
  - effective_from: '2025-07-04'
    formula: "if individual_ineligible_for_snap_participation_due_to_residence_or_status:\n\
      \  max(0, individual_financial_resources)\nelse: 0"
