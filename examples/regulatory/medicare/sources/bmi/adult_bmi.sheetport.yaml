# The binding of the BMI workbook for vitamin_d_bmi.le (drafted by the
# spreadsheet importer, ports renamed): the sheet: address fills the input
# ports in this order and reads the output port the address names.
spec: fio
spec_version: "0.3.0"
manifest:
  id: adult-bmi
  name: "Adult body mass index and its ICD-10-CM code"
  workbook:
    uri: "file://adult_bmi.xlsx"
    locale: en-US
    date_system: 1900
ports:
  - id: weight_kg
    dir: in
    shape: scalar
    location: { a1: "'BMI'!B1" }
    schema: { type: number }
  - id: height_cm
    dir: in
    shape: scalar
    location: { a1: "'BMI'!B2" }
    schema: { type: number }
  - id: bmi
    dir: out
    shape: scalar
    location: { a1: "'BMI'!B3" }
    schema: { type: number }
  - id: icd10_code
    dir: out
    shape: scalar
    location: { a1: "'BMI'!B4" }
    schema: { type: string }
